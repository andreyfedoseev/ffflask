[project]
name = "ffflask"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Andrey Fedoseev", email = "andrey@andreyfedoseev.com" }
]
requires-python = ">=3.10"
dependencies = [
    "Flask>=2,<3",
    "pydantic>=2,<=3",
    "typing-extensions>=4.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-mock>=3,<=4",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["I", "UP", "ANN", "S", "B", "A", "C4", "PIE", "T20", "PL", "SIM", "F", "RUF", "FURB"]
ignore = ["S101"]
